    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Var genomförs utredningen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "På plats i era egna lokaler. Vi flyttar hela den arbetsterapeutiska testmiljön till er, vilket minimerar deltagarnas restid och ger tydliga synergieffekter. Vid behov kan vi också ta emot i egen regi — hör av er så löser vi det."
            }
          },
          {
            "@type": "Question",
            "name": "Vad behöver vi som kommun bidra med?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "En lokal som går att stänga om under förmiddagarna, samt bord och stolar. Grundutrustning som datorer och symaskin kan ni antingen låta oss ta med, eller tillhandahålla själva — i det senare fallet sänks priset per deltagare från 38 500 kr till 34 500 kr exkl. moms."
            }
          },
          {
            "@type": "Question",
            "name": "Hur många deltagare krävs?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Minsta debitering för den stora utredningen är 8 deltagare, och vi tar emot upp till 10 parallellt. För enskilda eller akuta ärenden finns den kortare specialistutredningen, som också kan bakas in på eftermiddagarna under en pågående grupp."
            }
          },
          {
            "@type": "Question",
            "name": "Hur lång tid tar det innan vi har rapporten?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Utredningsperioden är fem veckor: tre veckor på plats och två veckor för klinisk analys. Slutrapporten levereras inom 14 dagar efter avslutad utredningsperiod, cirka 8–10 sidor per deltagare."
            }
          },
          {
            "@type": "Question",
            "name": "Kan rapporten användas mot Försäkringskassan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja. Rapporterna är kliniskt grundade och håller en kvalitet som gör att de kan användas som underlag eller bilaga vid ansökan om sjukersättning."
            }
          },
          {
            "@type": "Question",
            "name": "Hur hanteras deltagare som behöver tolk?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Den kortare specialistutredningen passar särskilt bra för ärenden som kräver språktolk. Tolk ombesörjs av kommunen, och upplägget med tre strukturerade tillfällen à 3,5 timmar anpassas efter det."
            }
          },
          {
            "@type": "Question",
            "name": "Vilket område är ni verksamma i?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Vi utgår från Uddevalla och är verksamma i hela Fyrbodal och Dalsland. På förfrågan åtar vi oss uppdrag även i andra områden."
            }
          },
          {
            "@type": "Question",
            "name": "Vad händer efter utredningen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ni får en strukturerad genomgång av slutrapporten där alla parter samlas kring samma utgångspunkt. Två till fyra månader senare gör vi en digital uppföljning med både deltagare och handläggare."
            }
          }
        ]
